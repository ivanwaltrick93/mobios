# Tudo:            docker compose up -d --build   → http://localhost:8080
# Só o banco (dev): docker compose up -d db        → e rode `pnpm dev` na máquina
name: mobios

x-api-image: &api-image
  image: mobios/api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # O padrão do Docker (64 MB de /dev/shm) não comporta as consultas paralelas sob concorrência: o Postgres
    # falha com "could not resize shared memory segment" (medido no teste de carga, docs/performance/DATABASE.md).
    shm_size: ${DB_SHM_SIZE:-256mb}
    # Observabilidade (docs/performance/DATABASE.md): estatística por consulta, tempo de I/O, consultas lentas
    # e esperas por trava no log. Ajuste de memória fica para quando houver medição no servidor de produção.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${DB_LOG_LENTAS_MS:-500}
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_USER: mobios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobios}
      POSTGRES_DB: mobios
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mobios_app}
    ports:
      # Só na própria máquina, para o `pnpm dev` e ferramentas de banco.
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mobios -d mobios']
      interval: 5s
      retries: 10

  # Cache de leitura (docs/decisoes/0001-redis-cache-de-leitura.md): descartável, sem persistência em disco e com
  # limite de memória. A API funciona sem ele (lê direto do Postgres), por isso não está no depends_on dela.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-mobios_redis}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      # Só na própria máquina, para o `pnpm dev` e os testes.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-mobios_redis}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Aplica as migrações e termina; a API só sobe depois que ele concluir com sucesso.
  migrate:
    <<: *api-image
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_MIGRATION_URL: postgres://mobios:${POSTGRES_PASSWORD:-mobios}@db:5432/mobios
      # Usados só na primeira instalação (banco sem usuários) para criar a oficina e o admin.
      OFICINA_NOME: ${OFICINA_NOME:-Minha Oficina}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://mobios_app:${APP_DB_PASSWORD:-mobios_app}@db:5432/mobios
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      # false enquanto o acesso for por http://localhost; true quando houver HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # A API só é acessada pelo Caddy (serviço web), pela rede interna do Docker (endereços privados).
      TRUST_PROXY: uniquelocal
      # Pool e limites de tempo no banco (docs/performance/DATABASE.md §Pool).
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_IDLE_TX_TIMEOUT_MS: ${DB_IDLE_TX_TIMEOUT_MS:-60000}
      # Cache de leitura; vazio = desligado (tudo direto do Postgres).
      REDIS_URL: redis://:${REDIS_PASSWORD:-mobios_redis}@redis:6379/0
      CACHE_TTL_PAINEL_S: ${CACHE_TTL_PAINEL_S:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mobios/web:local
    restart: unless-stopped
    ports:
      # O Caddy escuta na 8080 dentro do contêiner (sem root). Produção com domínio: "80:8080" e "443:8443".
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
