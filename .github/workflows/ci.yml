# Verificação obrigatória de todo push e pull request: formatação, lint, tipos e testes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # Versão fixa: trocar o sistema do runner é decisão nossa, não atualização automática do GitHub.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Mesma versão usada nos Dockerfiles.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Valores só de teste, sem segredo real: o banco sobe vazio dentro do runner.
      - name: Preparar .env de teste
        run: cp .env.example .env

      - name: Subir o PostgreSQL (cria mobios_app e mobios_test via infra/db/init.sh) e o Redis (cache)
        run: docker compose up -d --wait db redis

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
